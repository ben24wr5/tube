name: Build Tube Mac Player

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Build the app
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p results
          swift build -c release --arch arm64 --arch x86_64 2>&1 | tee results/build-log.txt

      - name: Put Tube Mac Player.app together
        if: steps.build.outcome == 'success'
        run: |
          APP="Tube Mac Player.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/apple/Products/Release/TubeMacPlayer "$APP/Contents/MacOS/TubeMacPlayer"
          lipo -info "$APP/Contents/MacOS/TubeMacPlayer" | tee -a results/build-log.txt
          cp Info.plist "$APP/Contents/Info.plist"
          cp Logo.png "$APP/Contents/Resources/Logo.png"
          ICONSET="$RUNNER_TEMP/AppIcon.iconset"; mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s AppIcon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) AppIcon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "results/Tube Mac Player.zip"
          # Standard Mac installer: open it, drag the app onto Applications
          DMGDIR="$RUNNER_TEMP/dmg"; mkdir -p "$DMGDIR"
          cp -R "$APP" "$DMGDIR/"
          ln -s /Applications "$DMGDIR/Applications"
          hdiutil create -volname "Tube Mac Player" -srcfolder "$DMGDIR" -ov -format UDZO "results/Tube Mac Player.dmg"
          echo "Build succeeded" > results/status.txt

      - name: Open the app and take real screenshots
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p results/screenshots
          open "Tube Mac Player.app"
          sleep 12
          osascript -e 'tell application "System Events" to set frontmost of (first process whose name is "TubeMacPlayer") to true' || true
          sleep 2
          screencapture -x results/screenshots/1-home.png
          sleep 10
          screencapture -x results/screenshots/2-home-loaded.png
          pgrep -l TubeMacPlayer > results/screenshots/running.txt || echo "not running" > results/screenshots/running.txt
          pkill TubeMacPlayer || true

      - name: Check the starter videos and pictures can be reached
        if: always()
        continue-on-error: true
        run: |
          mkdir -p results
          while read -r u; do
            [ -z "$u" ] && continue
            echo "$(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}' -L --max-time 25 -r 0-2000 "$u") $u" >> results/urlcheck.txt
          done < links-to-check.txt
          cat results/urlcheck.txt

      - name: Note the failure
        if: steps.build.outcome != 'success'
        run: echo "Build failed" > results/status.txt

      - name: Publish the results to the build-results branch
        if: always()
        run: |
          git config user.name "Tube Mac Player builder"
          git config user.email "builder@users.noreply.github.com"
          cp -R results "$RUNNER_TEMP/results"
          git fetch origin build-results || true
          git checkout --orphan build-results-new
          git rm -rf . >/dev/null
          git clean -fdxq
          cp -R "$RUNNER_TEMP/results/." .
          echo "${GITHUB_SHA}" > built-from.txt
          git add -A
          git commit -m "Build results for ${GITHUB_SHA}"
          git push -f origin HEAD:build-results
